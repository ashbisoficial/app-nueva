<ion-content [fullscreen]="true" class="personas-content">
  <div class="personas-encabezado">
    <h1>Mis personas</h1>
    <button class="personas-agregar" routerLink="/personas/nueva" aria-label="Agregar persona">
      <ion-icon name="add-outline"></ion-icon>
    </button>
  </div>

  <div class="personas-cuerpo">
    @if ((personas$ | async); as personas) {
      @if (personas.length === 0) {
        <p class="personas-vacio">Todavía no agregaste a nadie. Toca el botón "+" para empezar.</p>
      } @else {
        <div class="personas-lista">
          @for (p of personas; track p.id; let i = $index) {
            <a class="persona-fila" [routerLink]="['/personas', p.id]">
              <span class="persona-fila__avatar" [style.background]="colorPersona(i)">{{ inicialPersona(p.nombre) }}</span>
              <span class="persona-fila__texto">
                <span class="persona-fila__nombre">{{ p.nombre }}</span>
                <span class="persona-fila__fecha">{{ p.fechaNacimiento }}</span>
              </span>
              <ion-icon name="chevron-forward-outline" class="persona-fila__flecha"></ion-icon>
            </a>
          }
        </div>
      }
    }
  </div>

  <app-bottom-nav></app-bottom-nav>
</ion-content>
