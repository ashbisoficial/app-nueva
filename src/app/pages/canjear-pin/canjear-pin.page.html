<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Tengo un PIN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p style="color: var(--ion-color-medium)">
    Ingresa el código de 6 dígitos que te compartió el titular de un perfil para acceder a él.
  </p>

  <form (ngSubmit)="canjear()">
    <ion-list>
      <ion-item>
        <ion-input label="PIN" labelPlacement="floating" inputmode="numeric" maxlength="6" [(ngModel)]="pin" name="pin" required></ion-input>
      </ion-item>
    </ion-list>

    @if (error()) {
      <p class="ion-padding-start" style="color: var(--ion-color-danger)">{{ error() }}</p>
    }

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cargando() || pin.length !== 6">
      Acceder
    </ion-button>
  </form>
</ion-content>
