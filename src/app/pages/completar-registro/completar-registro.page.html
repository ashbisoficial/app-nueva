<ion-content class="ion-padding registro-content">
  <div class="registro-card">
    <h1>Un último paso</h1>
    <p class="subtitulo">
      Para que cada persona tenga una sola cuenta en Serangelia, necesitamos tu RUT.
    </p>

    <form (ngSubmit)="confirmar()" novalidate>
      <ion-list>
        <ion-item [class.campo-invalido]="v.error('rut')">
          <ion-input
            label="RUT *"
            labelPlacement="floating"
            placeholder="12.345.678-9"
            [ngModel]="rut"
            (ngModelChange)="onRutInput($event)"
            name="rut"
            (ionBlur)="v.campo('rut')"
          ></ion-input>
        </ion-item>
        @if (v.error('rut'); as e) { <p class="texto-error-campo">{{ e }}</p> }
      </ion-list>

      @if (error()) {
        <ion-text color="danger">
          <p class="ion-padding-start" role="alert">{{ error() }}</p>
        </ion-text>
      }

      <ion-button expand="block" type="submit" class="form-boton-principal" [disabled]="cargando()">
        @if (cargando()) {
          <ion-spinner name="dots"></ion-spinner>
        } @else {
          Continuar
        }
      </ion-button>
      <ion-button expand="block" fill="clear" color="medium" type="button" (click)="cerrarSesion()">
        Cerrar sesión
      </ion-button>
    </form>
  </div>
</ion-content>
